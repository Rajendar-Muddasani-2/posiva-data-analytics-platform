version: '3.8'

services:
  posiva-dashboard:
    build: .
    container_name: posiva-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    command: streamlit run webapp/app.py

  # Optional: Jupyter Lab service
  jupyter:
    build: .
    container_name: posiva-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    environment:
      - JUPYTER_ENABLE_LAB=yes
    restart: unless-stopped
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root

  # Optional: MLflow tracking server
  mlflow:
    build: .
    container_name: posiva-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./models/mlruns:/app/mlruns
    restart: unless-stopped
    command: mlflow ui --host 0.0.0.0 --port 5000
